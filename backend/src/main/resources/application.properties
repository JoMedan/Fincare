# ✅ MySQL 연결 정보 (환경변수 없으면 로컬 기본값 사용)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/fincaredb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:csedbadmin}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ✅ JPA 설정
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# ✅ 서버 포트
server.port=8080
server.address=0.0.0.0

# ✅ Swagger 설정
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ✅ Jackson 날짜 포맷
spring.jackson.date-format=yyyy-MM-dd
spring.jackson.serialization.write-dates-as-timestamps=false

# ✅ JWT 설정
jwt.secret=${JWT_SECRET:your-256-bit-secret-key-that-is-very-secure-and-long-enough}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

# ✅ Redis 설정
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}

# ✅ CORS 허용 출처
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}

# ✅ OpenAI API
openai.api.key=${OPENAI_API_KEY:}
